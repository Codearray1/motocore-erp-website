    <script>
      // Apply the saved (or system) theme before first paint so pre-rendered pages don't flash
      (function () {
        try {
          var t = localStorage.getItem("motocore_theme");
          var dark = t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          var d = document.documentElement;
          d.setAttribute("data-theme", dark ? "dark" : "light");
          d.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
    <script>
      // Early robust patch to prevent "Cannot set property 'fetch' of #<Window> which has only a getter"
      (function() {
        try {
          var originalFetch = window.fetch;
          var customFetch = originalFetch;

          // Try standard property redefinition first (most direct and safest)
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (desc && desc.configurable) {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() { return customFetch; },
              set: function(val) { customFetch = val; }
            });
            return;
          }
          
          // Try the prototype of window (e.g. Window.prototype)
          var proto = window;
          while (proto = Object.getPrototypeOf(proto)) {
            var protoDesc = Object.getOwnPropertyDescriptor(proto, 'fetch');
            if (protoDesc && protoDesc.configurable) {
              Object.defineProperty(proto, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function() { return customFetch; },
                set: function(val) { customFetch = val; }
              });
              return;
            }
          }

          // If fetch is completely locked on window and its prototype chain, 
          // we proxy globalThis and self to catch assignments to globalThis.fetch/self.fetch
          var globalProxy = new Proxy(window, {
            get: function(target, prop, receiver) {
              if (prop === 'fetch') {
                return customFetch;
              }
              var value = Reflect.get(target, prop, target);
              if (typeof value === 'function') {
                return value.bind(target);
              }
              return value;
            },
            set: function(target, prop, val, receiver) {
              if (prop === 'fetch') {
                customFetch = val;
                return true;
              }
              return Reflect.set(target, prop, val, target);
            }
          });

          Object.defineProperty(window, 'globalThis', {
            configurable: true,
            enumerable: true,
            get: function() { return globalProxy; }
          });

          Object.defineProperty(window, 'self', {
            configurable: true,
            enumerable: true,
            get: function() { return globalProxy; }
          });
        } catch (e) {
          console.warn("Could not fully resolve fetch write restriction, error:", e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
